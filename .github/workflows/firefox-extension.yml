name: Firefox extension
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes web-ext@8 lint
      - run: npx --yes web-ext@8 build --source-dir . --artifacts-dir ./dist --overwrite-dest --filename AI-Flow-Bypasser.xpi
      - name: Sign with Mozilla AMO (optional)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "Skipping signing: AMO secrets are not configured."
            exit 0
          fi
          npx --yes web-ext@8 sign --source-dir . --artifacts-dir ./dist --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/
